
name: Deploy SmartData to Databricks

on:
  push:
    branches:
      - main
    paths:
      - "proceso/**"
      - "scripts/**"
      - "seguridad/**"
      - ".github/workflows/deploy_databricks.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Desplegar notebooks
        run: |
          databricks workspace import-dir proceso /Shared/SmartData-ECommerce --overwrite

      - name: Ejecutar Job SmartData ECommerce DEV
        run: |
          databricks jobs run-now 311114614545262

      - name: Confirmar despliegue
        run: |
          echo "Despliegue de SmartData-ECommerce finalizado"
