
name: Deploy SmartData ECommerce PROD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_prod:
    name: Desplegar y ejecutar ETL PROD
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
      JOB_ID: "228868758540045"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verificar conexion PROD
        run: databricks current-user me

      - name: Crear carpeta en PROD
        run: |
          databricks workspace mkdirs /Shared/SmartData-ECommerce

      - name: Desplegar notebooks a PROD
        run: |
          for notebook in \
            00_Preparacion_Ambiente \
            01_Ingesta_Raw_Bronze \
            02_Transformacion_Silver \
            03_Procesamiento_Gold \
            04_Grants
          do
            databricks workspace import \
              "/Shared/SmartData-ECommerce/${notebook}" \
              --file "proceso/${notebook}.py" \
              --language PYTHON \
              --format SOURCE \
              --overwrite
          done

      #- name: Ejecutar Job PROD
       # run: |
        #  databricks jobs run-now "${JOB_ID}" --timeout 45m

      - name: Confirmar despliegue
        run: |
          echo "Despliegue y ejecucion PROD completados"
