
name: Deploy SmartData to Databricks

on:
  push:
    branches:
      - main
    paths:
      - "proceso/**"
      - "scripts/**"
      - "seguridad/**"
      - ".github/workflows/deploy_databricks.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartdata-ecommerce-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy y ejecutar ETL
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      JOB_ID: "311114614545262"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verificar conexion OAuth
        run: |
          databricks current-user me

      
      
      - name: Desplegar notebooks
        run: |
          for notebook in \
            00_Preparacion_Ambiente \
            01_Ingesta_Raw_Bronze \
            02_Transformacion_Silver \
            03_Procesamiento_Gold \
            04_Grants
          do
            databricks workspace import \
              "/Shared/SmartData-ECommerce/${notebook}" \
              --file "proceso/${notebook}.py" \
              --language PYTHON \
              --format SOURCE \
              --overwrite
          done

      - name: Ejecutar Job Bronze Silver Gold
        run: |
          echo "Iniciando Job: ${JOB_ID}"

          databricks jobs run-now "${JOB_ID}" \
            --timeout 45m

          echo "Job finalizado correctamente"

      - name: Confirmar despliegue
        if: success()
        run: |
          echo "===================================="
          echo "SMARTDATA E-COMMERCE"
          echo "Despliegue: CORRECTO"
          echo "Ejecucion ETL: CORRECTA"
          echo "Bronze - Silver - Gold"
          echo "===================================="
